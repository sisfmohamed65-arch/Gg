<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نيورا | Neura - مساعدك الذكي</title>
<meta name="description" content="نيورا: مساعد ذكاء اصطناعي مجاني بيجاوب على أسئلتك وبيعملك صور">
<meta name="theme-color" content="#6a3df0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --me:#2d6cdf; --bot:#232733; --txt:#e8eaf0; --mut:#8b90a0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; background:var(--card); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:10px; font-size:18px;
           background:linear-gradient(90deg,#a78bfa,#38bdf8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand img { border-radius:8px; }
  .brand small { color:var(--mut); -webkit-text-fill-color:var(--mut); font-weight:400; font-size:12px; letter-spacing:1px; }
  header button { background:none; border:1px solid #333; color:var(--mut); border-radius:8px; padding:4px 10px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.7; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-start; background:var(--me); }
  .bot { align-self:flex-end; background:var(--bot); }
  .msg img { max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .hint { color:var(--mut); text-align:center; font-size:14px; margin:auto; }
  form { display:flex; gap:8px; padding:12px; background:var(--card); }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--txt); border:1px solid #333; border-radius:12px;
             padding:10px 12px; font:inherit; max-height:120px; }
  button.send, button.img { border:0; border-radius:12px; padding:0 16px; cursor:pointer; font:inherit; color:#fff; }
  button.send { background:var(--me); }
  button.img { background:#333; }
  button.img.on { background:#8a3ffc; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <span class="brand"><img src="favicon.svg" alt="" width="30" height="30"> نيورا <small>Neura</small></span>
  <button id="clear" type="button">مسح</button>
</header>

<div id="chat">
  <div class="hint" id="hint">اسألني أي سؤال 👋<br>أو دوس 🎨 عشان أعملك صورة</div>
</div>

<form id="form">
  <button type="button" class="img" id="imgBtn" title="وضع الصور">🎨</button>
  <textarea id="input" rows="1" placeholder="اكتب رسالتك..."></textarea>
  <button class="send" id="sendBtn">إرسال</button>
</form>

<script>
// ⚠️ غيّر الرابط ده برابط الـ Worker بتاعك بعد ما تنشره على Cloudflare
const WORKER_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const imgBtn = document.getElementById("imgBtn");
let history = [];
let imageMode = false;

imgBtn.onclick = () => {
  imageMode = !imageMode;
  imgBtn.classList.toggle("on", imageMode);
  input.placeholder = imageMode ? "صف الصورة اللي عايزها..." : "اكتب رسالتك...";
};

document.getElementById("clear").onclick = () => {
  history = [];
  chat.innerHTML = '<div class="hint">اسألني أي سؤال 👋<br>أو دوس 🎨 عشان أعملك صورة</div>';
};

function add(role, text) {
  const hint = document.querySelector(".hint");
  if (hint) hint.remove();
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function post(payload) {
  const r = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "حصل خطأ");
  return j;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;
  add("user", (imageMode ? "🎨 " : "") + text);
  const wait = add("bot", imageMode ? "بجهّز الصورة..." : "بفكر...");

  try {
    if (imageMode) {
      const { url } = await post({ type: "image", prompt: text });
      wait.textContent = "اتفضل الصورة:";
      const img = new Image();
      img.alt = text;
      img.onload = () => { chat.scrollTop = chat.scrollHeight; };
      img.onerror = () => { wait.textContent = "الصورة مجتش، جرب تاني."; };
      img.src = url;
      wait.appendChild(img);
    } else {
      history.push({ role: "user", text });
      const { text: reply } = await post({ messages: history });
      history.push({ role: "model", text: reply });
      wait.textContent = reply || "(مفيش رد)";
    }
  } catch (err) {
    wait.textContent = "⚠️ " + err.message;
    if (!imageMode) history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});
</script>
</body>
</html>
